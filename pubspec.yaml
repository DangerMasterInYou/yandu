name: yandu
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.10.0
  dotenv: ^4.2.0
  firebase_core: ^4.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: DotMatrix
      fonts:
        - asset: assets/fonts/DotMatrix/DOTMATRI.ttf
        - asset: assets/fonts/DotMatrix/DOTMBold.ttf
          weight: 700
